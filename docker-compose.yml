version: '3.8'

services:
  # Mock Posting Service as provided in the PDF specification
  mock-posting-service:
    image: vinhopenfabric/mock-posting-service:latest
    container_name: mock-posting-service
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Queue Server
  redis:
    image: redis:7-alpine
    container_name: redis-queue
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL Database (recommended for 1,000+ TPS)
  # Enable by using the 'postgres' profile: docker-compose --profile postgres up
  postgres:
    image: postgres:16-alpine
    container_name: transaction-postgres
    profiles: ["postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: txuser
      POSTGRES_PASSWORD: txpass
      POSTGRES_DB: transactions
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=400
        -c shared_buffers=512MB
        -c effective_cache_size=1GB
        -c work_mem=8MB
        -c synchronous_commit=off
        -c wal_buffers=32MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txuser -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction Processing FastAPI Service (SQLite backend — default)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-api
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:////app/data/transactions.db
      - SYNC_DATABASE_URL=sqlite:////app/data/transactions.db
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=40
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_NAME=transaction_processing_queue
      - MOCK_POSTING_SERVICE_URL=http://mock-posting-service:8080
      - POSTING_REQUEST_TIMEOUT_SECONDS=15.0
      - MAX_RETRY_ATTEMPTS=5
      - WORKER_CONCURRENCY=10
      - OUTBOX_POLL_INTERVAL_SECONDS=0.1
      - OUTBOX_BATCH_SIZE=100
    depends_on:
      redis:
        condition: service_healthy
      mock-posting-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Transaction Processing FastAPI Service (PostgreSQL backend)
  api-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-api-postgres
    profiles: ["postgres"]
    ports:
      - "8001:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 8 --no-access-log"
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://txuser:txpass@postgres:5432/transactions
      - SYNC_DATABASE_URL=postgresql+psycopg2://txuser:txpass@postgres:5432/transactions
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=15
      - DB_POOL_RECYCLE_SECONDS=300
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_NAME=transaction_processing_queue
      - MOCK_POSTING_SERVICE_URL=http://mock-posting-service:8080
      - POSTING_REQUEST_TIMEOUT_SECONDS=15.0
      - MAX_RETRY_ATTEMPTS=5
      - WORKER_CONCURRENCY=0
      - OUTBOX_POLL_INTERVAL_SECONDS=0.1
      - OUTBOX_BATCH_SIZE=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-posting-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Dedicated Background Worker Process for PostgreSQL
  worker-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-worker-postgres
    profiles: ["postgres"]
    command: ["python", "-m", "app.workers.run_worker"]
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://txuser:txpass@postgres:5432/transactions
      - SYNC_DATABASE_URL=postgresql+psycopg2://txuser:txpass@postgres:5432/transactions
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_NAME=transaction_processing_queue
      - MOCK_POSTING_SERVICE_URL=http://mock-posting-service:8080
      - POSTING_REQUEST_TIMEOUT_SECONDS=15.0
      - WORKER_CONCURRENCY=10
      - PROCESSING_LEASE_TIMEOUT_SECONDS=20.0
      - RECONCILIATION_INTERVAL_SECONDS=2.0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Dedicated Background Worker Process
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-worker
    command: ["python", "-m", "app.workers.run_worker"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:////app/data/transactions.db
      - SYNC_DATABASE_URL=sqlite:////app/data/transactions.db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_NAME=transaction_processing_queue
      - MOCK_POSTING_SERVICE_URL=http://mock-posting-service:8080
      - POSTING_REQUEST_TIMEOUT_SECONDS=15.0
      - WORKER_CONCURRENCY=10
      - PROCESSING_LEASE_TIMEOUT_SECONDS=20.0
      - RECONCILIATION_INTERVAL_SECONDS=2.0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  redis-data:
  postgres-data:
